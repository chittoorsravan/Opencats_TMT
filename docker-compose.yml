version: '3.1'

services:
  opencats:
    container_name: opencats
    build: .
    ports:
      - "8080:80"
    links:
      - opencats-db

  opencats-db:
    container_name: opencats-db
    image: mysql:5.5
    ports:
      - "3306:3306"
    volumes:
      - /var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: opencats
      MYSQL_DATABASE: opencats
      MYSQL_USER: opencats
      MYSQL_PASSWORD: opencats

# optional:

  phpmyadmin:  
    container_name: phpmyadmin
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    links:
      - opencats-db:db
    environment:
      PMA_HOST: db
      PMA_USER: user-here
      PMA_PASSWORD: password-here

networks:
  opencats_network:
    driver: overlay
